<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2f6f4f" />
  <meta name="description" content="Personal diet & easy training plan — sugar-free, gluten-free, low cholesterol, quick recipes with mindfulness." />
  <title>MyPlan — Diet &amp; Easy Training</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A5%97%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <h1>MyPlan</h1>
        <p id="header-date" class="subtitle"></p>
      </div>
      <div class="header-stats">
        <div class="kcal-ring">
          <svg viewBox="0 0 44 44" width="56" height="56" aria-hidden="true">
            <circle class="ring-bg" cx="22" cy="22" r="19"></circle>
            <circle id="ring-fill" class="ring-fill" cx="22" cy="22" r="19"></circle>
          </svg>
          <div class="ring-label">
            <span id="ring-kcal">0</span>
            <small>kcal</small>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main id="view" class="view"></main>

  <nav class="tabbar" role="tablist">
    <button class="tab active" data-tab="today" role="tab">🍽️<span>Today</span></button>
    <button class="tab" data-tab="training" role="tab">🚶<span>Training</span></button>
    <button class="tab" data-tab="progress" role="tab">📈<span>Progress</span></button>
    <button class="tab" data-tab="reminders" role="tab">🔔<span>Reminders</span></button>
    <button class="tab" data-tab="settings" role="tab">⚙️<span>Settings</span></button>
  </nav>

  <div id="toast" class="toast" hidden></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
